# Rebuilds the website whenever the collection, the photos, the design or the builder changes.
# The admin page (/admin) commits catalog/looks.json and photos; this turns them into the pages in docs/,
# which GitHub Pages serves.
name: Build site
on:
  push:
    branches: [main]
    paths: ["catalog/**", "src/**", "build.py"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-site
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python build.py
      - name: Publish docs/
        run: |
          git config user.name "blush-site-builder"
          git config user.email "actions@users.noreply.github.com"
          git add -A docs
          if git diff --cached --quiet; then echo "Nothing to publish"; exit 0; fi
          git commit -m "Rebuild site"
          git pull --rebase origin main
          git push origin HEAD:main
